name = "nasha-danska"
main = "src/worker-v2.js"
compatibility_date = "2026-11-14"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/", "/study.html", "/login", "/setup", "/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "nasha-danska-v2"
# Replace this placeholder with the ID returned by: npx wrangler d1 create nasha-danska-v2
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
