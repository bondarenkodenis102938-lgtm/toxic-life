<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f6f1"><title>Початкове налаштування — Наша данська</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f5f6f1;color:#242923;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.panel{width:min(460px,100%);padding:28px;background:#fff;border:1px solid #e5e8e1;border-radius:18px;box-shadow:0 18px 55px #28372c0c}.mark{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:#285b47;color:white;font:700 24px Georgia,serif}.eyebrow{margin-top:20px;color:#66806a;font-size:10px;font-weight:800;letter-spacing:1px}.title{margin:5px 0;font-size:25px}.sub{color:#788078;font-size:12px;margin:0 0 18px}.field{margin:11px 0}.field label{display:block;margin-bottom:4px;font-size:11px;font-weight:750}.field input{width:100%;padding:10px;border:1px solid #dfe4dc;border-radius:8px;font:inherit}.hint{font-size:10px;color:#899187;margin-top:3px}button{width:100%;margin-top:9px;padding:11px;border:0;border-radius:8px;background:#285b47;color:white;font-weight:750;cursor:pointer}.error{min-height:20px;color:#a34d3d;font-size:11px;margin-top:9px}
</style></head><body><main class="panel"><div class="mark">d</div><div class="eyebrow">ОДНОРАЗОВЕ НАЛАШТУВАННЯ</div><h1 class="title">Створи головний акаунт</h1><p class="sub">Це створить єдиного Owner. Секрет налаштування надається окремо через захищені змінні Cloudflare.</p>
<form id="setupForm"><div class="field"><label for="setupSecret">Секрет налаштування</label><input id="setupSecret" type="password" autocomplete="off" required></div><div class="field"><label for="displayName">Ім'я для відображення</label><input id="displayName" required maxlength="60"></div><div class="field"><label for="username">Логін</label><input id="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_.-]+" autocomplete="username"><div class="hint">3–32 символи: латиниця, цифри, крапка, дефіс або підкреслення.</div></div><div class="field"><label for="password">Пароль</label><input id="password" type="password" required minlength="12" maxlength="200" autocomplete="new-password"><div class="hint">Щонайменше 12 символів.</div></div><button id="submit">Створити головний акаунт</button><div class="error" id="error" role="alert"></div></form></main>
<script>
document.getElementById('setupForm').addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('submit'),error=document.getElementById('error');button.disabled=true;error.textContent='';try{const r=await fetch('/api/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({setupSecret:document.getElementById('setupSecret').value,displayName:document.getElementById('displayName').value,username:document.getElementById('username').value,password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Не вдалося створити акаунт');location.replace('/study.html')}catch(err){error.textContent=err.message;button.disabled=false}});
</script></body></html>
