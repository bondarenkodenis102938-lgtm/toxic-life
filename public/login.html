<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f6f1"><title>Вхід — Наша данська</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f5f6f1;color:#242923;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.panel{width:min(420px,100%);padding:30px;background:#fff;border:1px solid #e5e8e1;border-radius:18px;box-shadow:0 18px 55px #28372c0c}.mark{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;background:#285b47;color:#fff;font:700 25px Georgia,serif}.eyebrow{margin-top:22px;color:#66806a;font-size:10px;font-weight:800;letter-spacing:1.2px}.title{margin:5px 0;font-size:27px;letter-spacing:-1px}.sub{margin:0 0 22px;color:#788078;font-size:13px}.field{margin:13px 0}.field label{display:block;margin-bottom:5px;font-size:12px;font-weight:700}.field input{width:100%;padding:12px;border:1px solid #dfe4dc;border-radius:9px;font:inherit;outline:none}.field input:focus{border-color:#89a28d;box-shadow:0 0 0 3px #285b4710}button{width:100%;margin-top:8px;padding:12px;border:0;border-radius:9px;background:#285b47;color:#fff;font:700 13px system-ui;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.error{min-height:20px;margin-top:12px;color:#a34d3d;font-size:12px}.foot{margin-top:20px;color:#98a097;font-size:11px;text-align:center}
</style></head><body><main class="panel"><div class="mark">d</div><div class="eyebrow">ПРИВАТНИЙ ПРОСТІР</div><h1 class="title">Наша данська</h1><p class="sub">Увійди, щоб продовжити спільну роботу над нотатками.</p>
<form id="loginForm"><div class="field"><label for="username">Логін</label><input id="username" name="username" autocomplete="username" required></div><div class="field"><label for="password">Пароль</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button id="submit" type="submit">Увійти</button><div class="error" id="error" role="alert"></div></form><div class="foot">Доступ лише за запрошенням.</div></main>
<script>
(async()=>{try{const r=await fetch('/api/me');const d=await r.json();if(d.loggedIn)location.replace('/study.html')}catch{}})();
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('submit'),error=document.getElementById('error');button.disabled=true;error.textContent='';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Не вдалося увійти');location.replace('/study.html')}catch(err){error.textContent=err.message;button.disabled=false}});
</script></body></html>
